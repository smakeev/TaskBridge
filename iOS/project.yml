name: TaskBridge
options:
  bundleIdPrefix: com.taskbridge
targets:
  TaskBridge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [TaskBridge]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      FRAMEWORK_SEARCH_PATHS: 
        - $(inherited)
        - $(SRCROOT)/../Core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
      OTHER_LDFLAGS: "$(inherited) -framework TaskBridgeCore"
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
      GCC_WARN_64_TO_32_BIT_CONVERSION: NO
      CLANG_WARN_DOCUMENTATION_COMMENTS: NO
      RUN_CLANG_STATIC_ANALYZER: NO
      COMPILER_INDEX_STORE_ENABLE: NO
    preBuildScripts:
      - name: Build KMP framework
        script: |
          mkdir -p "$SRCROOT/../Core/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME"
          
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          fi
          ./gradlew :Core:embedAndSignAppleFrameworkForXcode
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
