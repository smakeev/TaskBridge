# TaskBridge Architecture

TaskBridge is a Kotlin Multiplatform sample app that keeps business logic in a shared Core module and presents it through thin native Android and iOS applications. The project demonstrates shared domain models, reactive state, platform capability handlers, and platform-specific UI layers.

## Modules

| Module | Responsibility |
| --- | --- |
| `Core` | Shared Kotlin Multiplatform logic: models, services, use cases, stories, interactors, storage, networking, and event buses. |
| `Android` | Native Android app built with Jetpack Compose. It adapts Core interactors into Android repositories and renders screens. |
| `iOS` | Native SwiftUI app. It adapts Core interactors into Swift repositories and exposes Core flows as Swift async streams. |
| `Platform_Handlers` | Platform-facing handler module for capabilities that Core cannot implement directly on every platform. |
| `docs` | Static documentation and mock API data, including task template JSON used by the templates flow. |

## High-Level Flow

```text
Android Compose UI / SwiftUI
        |
Platform repositories
        |
Core interactors
        |
Use cases
        |
Stories
        |
Stateful and stateless services
        |
Storage, network clients, platform handlers, event buses
```

The UI does not talk to storage, networking, or platform notification APIs directly. It works through repositories, and repositories delegate to Core interactors.

## Core Entry Point

`TaskBridge` is the public entry point into shared logic. Platform apps create it with:

- `PlatformDependencies`, used for platform-specific infrastructure such as database creation.
- `CorePlatformHandlers`, used for capabilities that need native implementations, such as reminders.

After creation, platform code obtains interactors from `TaskBridge`:

- `navigationInteractor()`
- `templatesInteractor()`
- `tasksInteractor()`
- `remindersInteractor()`

The entry point also exposes `eventEmitter`, which lets platform handlers notify Core about platform-side changes.

## Composition

`CoreAssembler` is the internal composition root. It owns:

- `CoreServiceLocator`, which lazily creates and keeps services.
- `UseCaseContainer`, which resolves public-to-Core use cases.
- `UserStoriesContainer`, which creates smaller internal story operations.
- `CoreEventBuses` and `CoreEventEmitter`, which connect platform events back into shared logic.

This keeps construction details inside Core while exposing a compact interactor API to Android and iOS.

## Core Layers

### Interactors

Interactors are the stable platform-facing facade. They expose flows and suspend functions that platform repositories can call without knowing how Core is assembled internally.

### Use Cases

Use cases coordinate domain operations and translate service data into platform-friendly state models. Examples include navigation state observation, task operations, template loading, and reminder management.

### Stories

Stories are small internal operations. They wrap focused actions such as loading tasks, replacing a task subtree, selecting a tab, loading a remote resource, or scheduling a reminder.

### Services

Services own long-lived state or process requests:

- Stateful services use reactive state and command processing.
- Stateless services process requests through a mailbox-style sequential loop.
- `AppStateService` owns navigation state.
- `TasksService` owns task tree state and persists changes through `TaskStorageManager`.
- `RemindersService` synchronizes Core reminder state with platform reminder handlers.
- `NetworkService` performs JSON network requests.
- `RemoteResourceService` stores remote resource state, loading errors, timestamps, TTL metadata, and in-flight request information.

## Data and Capabilities

Tasks are stored locally through a shared Room database abstraction in Core. Platform-specific database builders are supplied through `PlatformDependencies`.

Task templates are loaded from JSON through the shared network layer. The current template URL points at `docs/mock-api/templates.json` in the GitHub repository, and Core applies a TTL before reloading it.

Reminders are platform capabilities. Core defines the shared reminder model and orchestration, while Android and iOS provide native reminder handlers. Platform handlers report updates back to Core through `CoreEventEmitter`.

## Platform Layers

### Android

The Android app initializes `TaskBridge` in `MainActivity`, creates Android repository implementations around Core interactors, and renders screens with Jetpack Compose. Compose screens observe Kotlin flows and call repository methods for user actions.

### iOS

The iOS app initializes `TaskBridge` in `TaskBridgeApp`, creates Swift repository implementations around Core interactors, injects them through SwiftUI environment values, and converts Core flows into `AsyncStream` values for SwiftUI view models.

## Design Intent

The architecture keeps domain decisions in shared Kotlin code while allowing each platform to keep a native UI and native integrations. Core owns the rules, state transitions, storage orchestration, network loading, and event coordination. Android and iOS stay focused on presentation, lifecycle, and platform APIs.

  <script type="text/markdown" id="md-ru">
# Архитектура TaskBridge

TaskBridge - пример Kotlin Multiplatform приложения, где бизнес-логика находится в общем модуле Core, а Android и iOS остаются тонкими нативными оболочками. Проект показывает общие доменные модели, реактивное состояние, платформенные обработчики возможностей и нативные UI-слои.

## Модули

| Модуль | Ответственность |
| --- | --- |
| `Core` | Общая Kotlin Multiplatform логика: модели, сервисы, use cases, stories, interactors, storage, network и event buses. |
| `Android` | Нативное Android-приложение на Jetpack Compose. Адаптирует Core interactors в Android repositories и отображает экраны. |
| `iOS` | Нативное SwiftUI-приложение. Адаптирует Core interactors в Swift repositories и превращает Core flows в Swift async streams. |
| `Platform_Handlers` | Платформенный модуль для возможностей, которые Core не может реализовать одинаково на всех платформах. |
| `docs` | Статическая документация и mock API данные, включая JSON шаблонов задач. |

## Общий поток

```text
Android Compose UI / SwiftUI
        |
Platform repositories
        |
Core interactors
        |
Use cases
        |
Stories
        |
Stateful and stateless services
        |
Storage, network clients, platform handlers, event buses
```

UI не обращается напрямую к storage, network или платформенным notification API. Он работает через repositories, а repositories делегируют операции Core interactors.

## Точка входа Core

`TaskBridge` - публичная точка входа в общую логику. Платформенные приложения создают ее с:

- `PlatformDependencies`, которые дают Core доступ к платформенной инфраструктуре, например к созданию базы данных.
- `CorePlatformHandlers`, которые дают Core доступ к возможностям с нативной реализацией, например к reminders.

После создания платформенный код получает interactors из `TaskBridge`:

- `navigationInteractor()`
- `templatesInteractor()`
- `tasksInteractor()`
- `remindersInteractor()`

Точка входа также предоставляет `eventEmitter`, через который платформенные handlers сообщают Core об изменениях на стороне платформы.

## Композиция

`CoreAssembler` - внутренний composition root. Он владеет:

- `CoreServiceLocator`, который лениво создает и хранит сервисы.
- `UseCaseContainer`, который резолвит public-to-Core use cases.
- `UserStoriesContainer`, который создает небольшие внутренние story operations.
- `CoreEventBuses` и `CoreEventEmitter`, которые возвращают платформенные события обратно в общую логику.

Так детали сборки остаются внутри Core, а Android и iOS получают компактный interactor API.

## Слои Core

### Interactors

Interactors - стабильный фасад для платформ. Они предоставляют flows и suspend functions, которые repositories могут вызывать без знания внутренней сборки Core.

### Use cases

Use cases координируют доменные операции и переводят данные сервисов в state models, удобные для платформ. Примеры: наблюдение за navigation state, операции с задачами, загрузка templates и управление reminders.

### Stories

Stories - небольшие внутренние операции. Они инкапсулируют конкретные действия: загрузить задачи, заменить поддерево задачи, выбрать tab, загрузить remote resource или запланировать reminder.

### Services

Services владеют долгоживущим состоянием или обрабатывают запросы:

- Stateful services используют реактивное состояние и обработку команд.
- Stateless services обрабатывают requests через последовательный mailbox loop.
- `AppStateService` владеет navigation state.
- `TasksService` владеет деревом задач и сохраняет изменения через `TaskStorageManager`.
- `RemindersService` синхронизирует reminder state Core с платформенными reminder handlers.
- `NetworkService` выполняет JSON network requests.
- `RemoteResourceService` хранит состояние remote resources, ошибки загрузки, timestamps, TTL metadata и информацию о запросах в процессе.

## Данные и платформенные возможности

Задачи сохраняются локально через общий Room database abstraction в Core. Платформенные database builders передаются через `PlatformDependencies`.

Шаблоны задач загружаются из JSON через общий network layer. Текущий template URL указывает на `docs/mock-api/templates.json` в GitHub repository, а Core применяет TTL перед повторной загрузкой.

Reminders - платформенная возможность. Core определяет общую модель reminders и orchestration, а Android и iOS предоставляют нативные reminder handlers. Handlers отправляют обновления обратно в Core через `CoreEventEmitter`.

## Платформенные слои

### Android

Android-приложение инициализирует `TaskBridge` в `MainActivity`, создает Android repository implementations вокруг Core interactors и отображает экраны на Jetpack Compose. Compose screens наблюдают Kotlin flows и вызывают repository methods для пользовательских действий.

### iOS

iOS-приложение инициализирует `TaskBridge` в `TaskBridgeApp`, создает Swift repository implementations вокруг Core interactors, внедряет их через SwiftUI environment values и превращает Core flows в `AsyncStream` values для SwiftUI view models.

## Замысел архитектуры

Архитектура оставляет доменные решения в общем Kotlin-коде, но позволяет каждой платформе иметь нативный UI и нативные integrations. Core владеет правилами, state transitions, storage orchestration, network loading и event coordination. Android и iOS фокусируются на presentation, lifecycle и platform APIs.

  <script>
    const config = {
      en: {
        file: "architecture.en.md",
        fallbackId: "md-en",
        subtitle: "Shared Kotlin business logic with native Android and iOS presentation layers.",
        contents: "Contents",
        source: "Markdown source",
        repo: "Repository"
      },
      ru: {
        file: "architecture.ru.md",
        fallbackId: "md-ru",
        subtitle: "Общая бизнес-логика Kotlin с нативными слоями представления для Android и iOS.",
        contents: "Содержание",
        source: "Markdown источник",
        repo: "Репозиторий"
      }
    };

    function readStoredLanguage() {
      try {
        return localStorage.getItem("taskbridge-docs-lang");
      } catch (_) {
        return null;
      }
    }

    function storeLanguage(lang) {
      try {
        localStorage.setItem("taskbridge-docs-lang", lang);
      } catch (_) {
        // Some browsers restrict storage for local files; language switching still works for this page view.
      }
    }

    const state = {
      lang: new URLSearchParams(location.search).get("lang") || readStoredLanguage() || "en"
    };

    const contentEl = document.querySelector("#content");
    const tocEl = document.querySelector("#toc");
    const tocTitleEl = document.querySelector("#toc-title");
    const subtitleEl = document.querySelector("#subtitle");
    const sourceLinksEl = document.querySelector("#source-links");
    const buttons = [...document.querySelectorAll("[data-lang]")];

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function slugify(value) {
      return value
        .toLowerCase()
        .trim()
        .replace(/[`'"]/g, "")
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "");
    }

    function renderTable(lines) {
      const rows = lines
        .filter((line, index) => index !== 1)
        .map(line => line.trim().slice(1, -1).split("|").map(cell => inlineMarkdown(cell.trim())));
      const [head, ...body] = rows;
      return [
        "<table>",
        "<thead><tr>" + head.map(cell => `<th>${cell}</th>`).join("") + "</tr></thead>",
        "<tbody>" + body.map(row => "<tr>" + row.map(cell => `<td>${cell}</td>`).join("") + "</tr>").join("") + "</tbody>",
        "</table>"
      ].join("");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").trim().split("\n");
      const html = [];
      let paragraph = [];
      let list = [];
      let code = [];
      let inCode = false;
      let table = [];

      function flushParagraph() {
        if (paragraph.length) {
          html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      }

      function flushList() {
        if (list.length) {
          html.push("<ul>" + list.map(item => `<li>${inlineMarkdown(item)}</li>`).join("") + "</ul>");
          list = [];
        }
      }

      function flushTable() {
        if (table.length) {
          html.push(renderTable(table));
          table = [];
        }
      }

      for (const line of lines) {
        if (line.startsWith("```")) {
          flushParagraph();
          flushList();
          flushTable();
          if (inCode) {
            html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
            code = [];
            inCode = false;
          } else {
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          code.push(line);
          continue;
        }

        if (/^\|.*\|$/.test(line)) {
          flushParagraph();
          flushList();
          table.push(line);
          continue;
        }

        flushTable();

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = slugify(text);
          html.push(`<h${level} id="${id}">${inlineMarkdown(text)}</h${level}>`);
          continue;
        }

        const bullet = line.match(/^-\s+(.+)$/);
        if (bullet) {
          flushParagraph();
          list.push(bullet[1]);
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          continue;
        }

        paragraph.push(line.trim());
      }

      flushParagraph();
      flushList();
      flushTable();
      return html.join("\n");
    }

    async function loadMarkdown(lang) {
      const current = config[lang];
      try {
        if (location.protocol !== "file:") {
          const response = await fetch(current.file, { cache: "no-store" });
          if (response.ok) {
            return await response.text();
          }
        }
      } catch (_) {
        // Local file access often blocks fetch; the embedded copy keeps the page portable.
      }
      return document.querySelector(`#${current.fallbackId}`).textContent;
    }

    function renderToc() {
      const headings = [...contentEl.querySelectorAll("h2, h3")];
      tocEl.innerHTML = headings.map(heading => {
        const indent = heading.tagName === "H3" ? " style=\"padding-left: 20px\"" : "";
        return `<li><a${indent} href="#${heading.id}">${heading.textContent}</a></li>`;
      }).join("");
    }

    async function setLanguage(lang) {
      state.lang = config[lang] ? lang : "en";
      storeLanguage(state.lang);
      document.documentElement.lang = state.lang;

      buttons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.lang === state.lang));
      });

      const current = config[state.lang];
      subtitleEl.textContent = current.subtitle;
      tocTitleEl.textContent = current.contents;
      contentEl.innerHTML = renderMarkdown(await loadMarkdown(state.lang));
      sourceLinksEl.innerHTML = [
        `<a href="${current.file}">${current.source}</a>`,
        `<a href="https://github.com/smakeev/TaskBridge">GitHub ${current.repo}</a>`
      ].join(" / ");
      renderToc();
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => setLanguage(button.dataset.lang));
    });

    setLanguage(state.lang);
  </script>
</body>
